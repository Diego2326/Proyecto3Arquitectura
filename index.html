<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f3">
  <title>Control IoT</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1c2822;
      background: #f4f6f3;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --green: #246b4e;
      --green-dark: #194d38;
      --muted: #718078;
      --line: #e1e8e2;
      --paper: #fff;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }
    button, input { font: inherit; }
    .shell { width: min(100% - 32px, 760px); margin: 0 auto; padding: 28px 0 40px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 34px; }
    .brand { font-size: .9rem; font-weight: 750; letter-spacing: .02em; }
    .brand span { display: block; margin-top: 3px; color: var(--muted); font-size: .7rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
    .connection { display: inline-flex; align-items: center; gap: 8px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--muted); font-size: .76rem; }
    .connection-dot { width: 7px; height: 7px; border-radius: 50%; background: #bd7460; }
    .connection.online { border-color: #cfe4d5; color: var(--green-dark); }
    .connection.online .connection-dot { background: #41a36d; }
    h1 { margin: 0 0 19px; font-size: clamp(1.65rem, 4vw, 2.15rem); font-weight: 650; letter-spacing: -.045em; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    .metric, .panel { border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
    .metric { min-height: 96px; padding: 16px 18px; }
    .label { color: var(--muted); font-size: .76rem; }
    .value { margin-top: 12px; font-size: 1.55rem; font-weight: 650; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
    .unit { margin-left: 4px; color: var(--muted); font-size: .78rem; font-weight: 500; letter-spacing: 0; }
    .mode-value { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; }
    .mode-mark { width: 8px; height: 8px; border-radius: 50%; background: #43a06e; }
    .mode-value.manual .mode-mark { background: #9273c1; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .panel { padding: 19px; }
    .panel h2 { margin: 0 0 18px; font-size: .94rem; font-weight: 700; }
    .control-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .8rem; font-weight: 620; }
    output { color: var(--green); font-size: .88rem; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; height: 5px; margin: 16px 0 8px; accent-color: var(--green); cursor: pointer; }
    .scale { display: flex; justify-content: space-between; color: #98a29b; font-size: .68rem; }
    .apply-button { width: 100%; min-height: 42px; margin-top: 20px; border: 0; border-radius: 9px; background: var(--green-dark); color: white; font-size: .8rem; font-weight: 700; cursor: pointer; }
    .apply-button:hover { background: #236d4e; }
    .apply-button.secondary { border: 1px solid #d9e5dc; background: #edf5ef; color: var(--green-dark); }
    .apply-button.secondary:hover { background: #e2efe5; }
    .feedback { min-height: 20px; margin: 13px 2px 0; color: var(--muted); font-size: .76rem; }
    @media (max-width: 580px) {
      .shell { width: min(100% - 24px, 420px); padding-top: 20px; }
      header { margin-bottom: 28px; }
      .metrics { gap: 8px; }
      .metric { min-height: 86px; padding: 13px 11px; }
      .label { font-size: .68rem; }
      .value { font-size: 1.3rem; }
      .mode-value { font-size: .9rem; }
      .controls { grid-template-columns: 1fr; gap: 10px; }
      .panel { padding: 17px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">Control IoT<span>Arduino · Orange Pi</span></div>
      <div id="connection" class="connection" aria-live="polite">
        <span class="connection-dot"></span><span id="connectionText">Conectando</span>
      </div>
    </header>

    <h1>Control de proximidad</h1>

    <section class="metrics" aria-label="Lecturas del dispositivo">
      <article class="metric">
        <div class="label">Distancia</div>
        <div class="value"><span id="distanceValue">—</span><span id="distanceUnit" class="unit"></span></div>
      </article>
      <article class="metric">
        <div class="label">Ángulo del servo</div>
        <div class="value"><span id="angleValue">—</span><span class="unit">°</span></div>
      </article>
      <article class="metric">
        <div class="label">Modo</div>
        <div id="modeValue" class="value mode-value"><span class="mode-mark"></span><span id="modeText">Automático</span></div>
      </article>
    </section>

    <section class="controls" aria-label="Controles del servo">
      <article class="panel">
        <h2>Automático</h2>
        <label class="control-label" for="threshold"><span>Umbral</span><output id="thresholdOutput" for="threshold">15 cm</output></label>
        <input id="threshold" type="range" min="5" max="100" value="15">
        <div class="scale"><span>5 cm</span><span>100 cm</span></div>
        <button class="apply-button" id="autoButton" type="button">Activar automático</button>
      </article>

      <article class="panel">
        <h2>Manual</h2>
        <label class="control-label" for="manualAngle"><span>Ángulo objetivo</span><output id="manualOutput" for="manualAngle">0°</output></label>
        <input id="manualAngle" type="range" min="0" max="180" value="0">
        <div class="scale"><span>0°</span><span>180°</span></div>
        <button class="apply-button secondary" id="manualButton" type="button">Aplicar ángulo</button>
      </article>
    </section>

    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
  </main>

  <script>
    const threshold = document.querySelector('#threshold');
    const thresholdOutput = document.querySelector('#thresholdOutput');
    const manualAngle = document.querySelector('#manualAngle');
    const manualOutput = document.querySelector('#manualOutput');
    const autoButton = document.querySelector('#autoButton');
    const manualButton = document.querySelector('#manualButton');
    const feedback = document.querySelector('#feedback');
    let thresholdEdited = false;
    let angleEdited = false;
    let socket = null;
    let reconnectDelay = 700;
    let pendingMode = null;

    threshold.addEventListener('input', () => {
      thresholdEdited = true;
      thresholdOutput.value = `${threshold.value} cm`;
    });
    manualAngle.addEventListener('input', () => {
      angleEdited = true;
      manualOutput.value = `${manualAngle.value}°`;
    });

    function setConnection(connected, text) {
      const connection = document.querySelector('#connection');
      connection.classList.toggle('online', connected);
      document.querySelector('#connectionText').textContent = text;
    }

    function sendCommand(mode) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        feedback.textContent = 'Esperando conexión con Cloud Run…';
        return;
      }
      pendingMode = mode;
      const data = { mode, threshold_cm: Number(threshold.value) };
      if (mode === 'MANUAL') data.angle = Number(manualAngle.value);
      socket.send(JSON.stringify({ type: 'command', data }));
      feedback.textContent = 'Enviando comando…';
    }

    autoButton.addEventListener('click', () => sendCommand('AUTO'));
    manualButton.addEventListener('click', () => sendCommand('MANUAL'));

    function renderState(state) {
      const hasDistance = state.distance_cm !== null && state.distance_cm >= 0;
      document.querySelector('#distanceValue').textContent = hasDistance ? state.distance_cm : '—';
      document.querySelector('#distanceUnit').textContent = hasDistance ? 'cm' : 'Sin eco';
      document.querySelector('#angleValue').textContent = state.angle;
      document.querySelector('#modeText').textContent = state.mode === 'MANUAL' ? 'Manual' : 'Automático';
      document.querySelector('#modeValue').classList.toggle('manual', state.mode === 'MANUAL');
      setConnection(Boolean(state.online), state.online ? 'Arduino conectado' : 'Arduino desconectado');

      if (!thresholdEdited) {
        threshold.value = state.desired_threshold_cm;
        thresholdOutput.value = `${state.desired_threshold_cm} cm`;
      }
      if (!angleEdited) {
        manualAngle.value = state.desired_angle;
        manualOutput.value = `${state.desired_angle}°`;
      }
    }

    function connectWebSocket() {
      const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const connection = new WebSocket(`${scheme}//${location.host}/ws`);
      socket = connection;

      connection.addEventListener('open', () => {
        reconnectDelay = 700;
        setConnection(true, 'Servicio conectado');
      });
      connection.addEventListener('message', (event) => {
        let message;
        try { message = JSON.parse(event.data); }
        catch { return; }

        if (message.type === 'state') renderState(message.data);
        if (message.type === 'ack') {
          const result = message.data;
          if (pendingMode === 'AUTO') {
            thresholdEdited = false;
            feedback.textContent = `Automático · umbral ${result.threshold_cm} cm`;
          } else {
            angleEdited = false;
            feedback.textContent = `Ángulo manual · ${result.angle}°`;
          }
          pendingMode = null;
        }
        if (message.type === 'error') {
          feedback.textContent = message.message || 'No se pudo aplicar el comando.';
          pendingMode = null;
        }
      });
      connection.addEventListener('close', () => {
        if (socket === connection) socket = null;
        setConnection(false, 'Reconectando…');
        setTimeout(connectWebSocket, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 1.7, 5000);
      });
      connection.addEventListener('error', () => connection.close());
    }

    connectWebSocket();
  </script>
</body>
</html>
